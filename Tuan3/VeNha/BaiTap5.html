
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khoa CNTTKD</title>

<style>

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    color: #333;
}

.best-shared {
    text-align: center;
    margin: 50px auto;
    padding: 20px;
}

/* Logo BIT */
.logo img {
    width: 200px;
    height: auto;
}

/* Tiêu đề */
h2 {
    font-size: 36px;
    font-weight: normal;
    margin: 25px 0;
}

h2 strong {
    color: #00a9e0;
}

/* Nội dung mô tả */
.lead-text {
    font-size: 14px;
    color: #666;
    margin-bottom: 35px;
}

/* Hai nút chức năng */
.btn-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.btn-list li {
    display: inline-block;
    margin: 0 8px;
}

.btn-list a {
    display: inline-block;
    padding: 15px 30px;
    background-color: #303436;
    color: white;
    text-decoration: none;
    border-radius: 4px;
}

/* Hiệu ứng hover */
.btn-list a:hover {
    background-color: #00a9e0;
}

</style>
</head>

<body>

<section class="best-shared">

    <p class="logo">
        <img src="logo.png" alt="Logo BIT UEH">
    </p>

    <h2>
        Best <strong>Shared Hosting</strong> Company
    </h2>

    <p class="lead-text">
        With this responsive landing page template,
        you can promote your all hosting, domain and email services.
    </p>

    <ul class="btn-list">
        <li>
            <a href="#">View Plans</a>
        </li>

        <li>
            <a href="#">All Features</a>
        </li>
    </ul>

</section>

</body>
</html>
