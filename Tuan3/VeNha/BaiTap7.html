
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bai tap 7</title>

<style>
* {
    box-sizing: border-box;
}

#wrapper {
    width: 280px;
    margin: 30px auto;
    padding: 7px;
    border: 3px solid black;
    box-shadow: -12px 12px 10px #aaa;
}

header, nav, main, footer {
    border: 2px solid black;
    padding: 10px;
}

header {
    height: 48px;
    margin-bottom: 5px;
}

nav {
    width: 50px;
    height: 205px;
    float: left;
    margin-right: 5px;
}

main {
    height: 205px;
    overflow: hidden;
}

footer {
    height: 40px;
    margin-top: 5px;
}
</style>
</head>

<body>

<div id="wrapper">

    <header>header</header>

    <nav>nav</nav>

    <main>main</main>

    <footer>footer</footer>

</div>

</body>
</html>
